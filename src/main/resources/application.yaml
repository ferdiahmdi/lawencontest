spring:
  application:
    name: leave-service
  datasource:
    url: jdbc:postgresql://localhost:5432/leave_service
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false

app:
  security:
    jwt:
      issuer: leave-service
      expiration-seconds: 3600
      secret: change-me
