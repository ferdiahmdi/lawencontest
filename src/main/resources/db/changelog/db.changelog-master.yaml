databaseChangeLog:
  - changeSet:
      id: 001-create-employees-and-leaves
      author: copilot
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: quota
                  type: integer
                  defaultValueNumeric: 15
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: "ALTER TABLE employees ADD CONSTRAINT chk_employees_role CHECK (role IN ('EMPLOYEE','MANAGER'))"
        - createTable:
            tableName: leaves
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: approved_by
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: varchar(500)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: "ALTER TABLE leaves ADD CONSTRAINT chk_leaves_status CHECK (status IN ('PENDING','APPROVED','REJECTED'))"
        - addForeignKeyConstraint:
            baseTableName: leaves
            baseColumnNames: employee_id
            constraintName: fk_leaves_employee
            referencedTableName: employees
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: leaves
            baseColumnNames: approved_by
            constraintName: fk_leaves_approved_by
            referencedTableName: employees
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            tableName: leaves
            indexName: idx_leaves_employee_start
            columns:
              - column:
                  name: employee_id
              - column:
                  name: start_date
        - createIndex:
            tableName: leaves
            indexName: idx_leaves_status
            columns:
              - column:
                  name: status
